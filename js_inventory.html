<script>
  var cachedMasterItems = [];

  function switchStockSubTab(tab) {
    var btnBranch = document.getElementById('btnSubTabInv');
    var btnMaster = document.getElementById('btnSubTabMaster');
    var btnFlash = document.getElementById('btnSubTabFlash');
    var btnJenis = document.getElementById('btnSubTabJenis');

    var sectionBranch = document.getElementById('stockSubTabBranch');
    var sectionMaster = document.getElementById('stockSubTabMaster');
    var sectionFlash = document.getElementById('stockSubTabFlashSale');
    var sectionJenis = document.getElementById('stockSubTabJenisProduk');

    var btnAddMaster = document.getElementById('btnAddNewMasterStock');
    var btnImportCsv = document.getElementById('btnImportCsvMasterStock');
    var btnAddJenis = document.getElementById('btnAddNewJenisProduk');

    sectionBranch.classList.add('hidden');
    sectionMaster.classList.add('hidden');
    sectionFlash.classList.add('hidden');
    sectionJenis.classList.add('hidden');

    btnBranch.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-800 transition text-center';
    btnMaster.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-800 transition text-center';
    btnFlash.className = 'py-2 rounded-lg text-amber-600 hover:text-amber-800 transition flex items-center justify-center space-x-1';
    btnJenis.className = 'py-2 rounded-lg text-teal-700 hover:text-teal-900 transition flex items-center justify-center space-x-1';

    if (btnAddMaster) btnAddMaster.classList.add('hidden');
    if (btnImportCsv) btnImportCsv.classList.add('hidden');
    if (btnAddJenis) btnAddJenis.classList.add('hidden');

    if (tab === 'master') {
      sectionMaster.classList.remove('hidden');
      if (btnAddMaster) btnAddMaster.classList.remove('hidden');
      if (btnImportCsv) btnImportCsv.classList.remove('hidden');
      btnMaster.className = 'py-2 rounded-lg bg-white shadow-xs text-teal-800 transition font-bold text-center';
    } else if (tab === 'flash') {
      sectionFlash.classList.remove('hidden');
      btnFlash.className = 'py-2 rounded-lg bg-amber-500 shadow-xs text-white transition font-bold flex items-center justify-center space-x-1';
      renderFlashSaleAdminTable();
    } else if (tab === 'jenis') {
      sectionJenis.classList.remove('hidden');
      if (btnAddJenis) btnAddJenis.classList.remove('hidden');
      btnJenis.className = 'py-2 rounded-lg bg-teal-700 shadow-xs text-white transition font-bold flex items-center justify-center space-x-1';
      renderJenisProdukTable();
    } else {
      sectionBranch.classList.remove('hidden');
      btnBranch.className = 'py-2 rounded-lg bg-white shadow-xs text-teal-800 transition font-bold text-center';
    }
  }

  function openImportCsvModal() {
    document.getElementById('importCsvForm').reset();
    openModal('importCsvModal');
  }

  function downloadSampleCsvTemplate() {
    var csvHeaderAndBody = "SKU,ProductName,Description,Category,Brand,ImageURL,Price\n" +
      "SKU-YSC-001,Yusca Pro Runner - Black Size 42,Sepatu lari premium ringan dan empuk,Sepatu Lari,Yusca,https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500,1250000\n" +
      "SKU-YSC-002,Yusca Casual Sneakers - White Size 41,Sneakers kasual pria kulit sintetis premium,Sepatu Pria,Yusca,https://images.unsplash.com/photo-1582588678413-dbf45f4823e9?w=500,850000\n" +
      "SKU-YSC-003,Yusca Sporty Waistbag Anti-Air,Tas pinggang gym dan lari,Aksesoris,Nike,https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500,185000";

    var csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent(csvHeaderAndBody);
    var link = document.createElement("a");
    link.setAttribute("href", csvContent);
    link.setAttribute("download", "Template_Import_Master_Produk_YuscaSTORE.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast("Template CSV contoh berhasil diunduh!", "info");
  }

  function parseCSVText(text) {
    var lines = text.split(/\r\n|\n/);
    var result = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      
      var row = [];
      var insideQuote = false;
      var entry = '';
      for (var c = 0; c < line.length; c++) {
        var char = line[c];
        if (char === '"') {
          insideQuote = !insideQuote;
        } else if (char === ',' && !insideQuote) {
          row.push(entry.trim());
          entry = '';
        } else {
          entry += char;
        }
      }
      row.push(entry.trim());
      result.push(row);
    }
    return result;
  }

  function submitImportCsv() {
    var fileInput = document.getElementById('importCsvFileInput');
    if (!fileInput.files || fileInput.files.length === 0) {
      showToast('Silakan pilih file CSV terlebih dahulu!', 'warning');
      return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();

    var btn = document.getElementById('btnSubmitImportCsv');
    btn.disabled = true;
    btn.textContent = 'Membaca & Memproses File...';

    reader.onload = function(e) {
      var text = e.target.result;
      var parsedRows = parseCSVText(text);

      if (parsedRows.length < 2) {
        btn.disabled = false;
        btn.textContent = 'Mulai Import CSV';
        showToast('File CSV tidak memiliki data atau format tidak sesuai!', 'error');
        return;
      }

      var startIdx = 0;
      if (parsedRows[0][0] && parsedRows[0][0].toUpperCase() === 'SKU') {
        startIdx = 1;
      }

      var itemsToUpload = [];
      for (var i = startIdx; i < parsedRows.length; i++) {
        var r = parsedRows[i];
        if (r.length >= 2 && r[0]) {
          itemsToUpload.push({
            sku: r[0],
            productName: r[1] || 'Produk Baru',
            description: r[2] || '',
            category: r[3] || 'Sepatu Pria',
            brand: r[4] || 'Yusca',
            imageUrl: r[5] || '',
            price: parseFloat(r[6]) || 0
          });
        }
      }

      if (itemsToUpload.length === 0) {
        btn.disabled = false;
        btn.textContent = 'Mulai Import CSV';
        showToast('Tidak ada baris data valid yang ditemukan di file CSV!', 'warning');
        return;
      }

      var adminName = currentUser ? currentUser.name : 'Admin';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.textContent = 'Mulai Import CSV';
            closeModal('importCsvModal');
            showToast(res.message, res.success ? 'success' : 'error');
            loadMasterProducts(1);
            loadInventory(1);
          })
          .importMasterProductsCSV(itemsToUpload, adminName);
      } else {
        btn.disabled = false;
        btn.textContent = 'Mulai Import CSV';
        closeModal('importCsvModal');
        showToast('Simulasi Import Selesai: ' + itemsToUpload.length + ' produk diproses!', 'success');
        loadMasterProducts(1);
      }
    };

    reader.readAsText(file);
  }

  function renderFlashSaleAdminTable() {
    var tbody = document.getElementById('flashSaleAdminTableBody');
    if (!tbody) return;

    tbody.innerHTML = '';
    if (!cachedCatalogItems || cachedCatalogItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center p-4 text-gray-400">Tidak ada produk master untuk diset Flash Sale.</td></tr>';
      return;
    }

    var todayStr = new Date().toISOString().slice(0, 10);
    var futureDate = new Date();
    futureDate.setDate(futureDate.getDate() + 14);
    var defaultEndStr = futureDate.toISOString().slice(0, 10);

    for (var i = 0; i < cachedCatalogItems.length; i++) {
      var item = cachedCatalogItems[i];
      var isChecked = item.isFlashSale ? 'checked' : '';
      var discVal = item.discountPrice || Math.round(item.price * 0.8);
      var startVal = item.startDate || todayStr;
      var endVal = item.endDate || defaultEndStr;

      var tr = document.createElement('tr');
      tr.className = 'hover:bg-amber-50/50 transition';
      tr.innerHTML = 
        '<td class="p-3 pl-4 text-center">' +
          '<input type="checkbox" id="flashCheck_' + item.sku + '" ' + isChecked + ' onchange="toggleFlashSaleRow(\'' + item.sku + '\', this.checked)" class="flash-item-checkbox w-4 h-4 text-amber-600 rounded focus:ring-amber-500 cursor-pointer">' +
        '</td>' +
        '<td class="p-3 font-mono font-bold text-gray-800">' + item.sku + '</td>' +
        '<td class="p-3 font-medium text-gray-800">' + item.productName + '</td>' +
        '<td class="p-3 text-gray-600">Rp ' + item.price.toLocaleString('id-ID') + '</td>' +
        '<td class="p-3">' +
          '<input type="number" id="flashPrice_' + item.sku + '" value="' + discVal + '" class="w-28 border rounded-lg p-1.5 text-xs font-bold text-teal-800 focus:outline-none focus:border-amber-500">' +
        '</td>' +
        '<td class="p-3">' +
          '<input type="date" id="flashStart_' + item.sku + '" value="' + startVal + '" class="w-32 border rounded-lg p-1.5 text-xs font-mono text-gray-700 focus:outline-none focus:border-amber-500">' +
        '</td>' +
        '<td class="p-3">' +
          '<input type="date" id="flashEnd_' + item.sku + '" value="' + endVal + '" class="w-32 border rounded-lg p-1.5 text-xs font-mono text-gray-700 focus:outline-none focus:border-amber-500">' +
        '</td>' +
        '<td class="p-3 text-right pr-4">' +
          '<span id="flashBadge_' + item.sku + '" class="px-2.5 py-1 rounded-full text-xs font-bold ' + (item.isFlashSale ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-gray-100 text-gray-400') + '">' +
            (item.isFlashSale ? '⚡ FLASH SALE' : 'Non-Aktif') +
          '</span>' +
        '</td>';

      tbody.appendChild(tr);
    }
  }

  function toggleSelectAllFlash(isChecked) {
    var checkboxes = document.querySelectorAll('.flash-item-checkbox');
    checkboxes.forEach(function(chk) {
      chk.checked = isChecked;
      var sku = chk.id.replace('flashCheck_', '');
      toggleFlashSaleRow(sku, isChecked);
    });
  }

  function bulkSetFlashSaleStatus(isActive) {
    var checkboxes = document.querySelectorAll('.flash-item-checkbox');
    checkboxes.forEach(function(chk) {
      chk.checked = isActive;
      var sku = chk.id.replace('flashCheck_', '');
      toggleFlashSaleRow(sku, isActive);
    });
    showToast('Status Flash Sale berhasil diubah secara masal!', 'info');
  }

  function bulkApplyDiscountPercent(percent) {
    var factor = (100 - percent) / 100;
    for (var i = 0; i < cachedCatalogItems.length; i++) {
      var item = cachedCatalogItems[i];
      var prcEl = document.getElementById('flashPrice_' + item.sku);
      if (prcEl) {
        var calculated = Math.round(item.price * factor);
        prcEl.value = calculated;
      }
    }
    showToast('Preset diskon ' + percent + '% berhasil diterapkan ke semua produk!', 'success');
  }

  function toggleFlashSaleRow(sku, isChecked) {
    var badge = document.getElementById('flashBadge_' + sku);
    if (badge) {
      if (isChecked) {
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200';
        badge.textContent = '⚡ FLASH SALE';
      } else {
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-400';
        badge.textContent = 'Non-Aktif';
      }
    }
  }

  function saveFlashSaleConfigurations() {
    var flashConfig = {};
    for (var i = 0; i < cachedCatalogItems.length; i++) {
      var item = cachedCatalogItems[i];
      var chk = document.getElementById('flashCheck_' + item.sku);
      var prc = document.getElementById('flashPrice_' + item.sku);
      var str = document.getElementById('flashStart_' + item.sku);
      var end = document.getElementById('flashEnd_' + item.sku);

      if (chk && prc) {
        var isFlash = chk.checked;
        var discPrice = parseFloat(prc.value) || Math.round(item.price * 0.8);
        var sDate = str ? str.value : '';
        var eDate = end ? end.value : '';

        flashConfig[item.sku] = {
          isFlashSale: isFlash,
          discountPrice: discPrice,
          startDate: sDate,
          endDate: eDate
        };

        item.isFlashSale = isFlash;
        item.discountPrice = discPrice;
        item.startDate = sDate;
        item.endDate = eDate;
      }
    }

    var adminName = currentUser ? currentUser.name : 'Admin';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          showToast(res.message, res.success ? 'success' : 'error');
          loadCatalog(1);
        })
        .saveFlashSaleBackend(flashConfig, adminName);
    } else {
      renderGroupedCatalogSliders(cachedCatalogItems);
      showToast('Pengaturan Promo & Jadwal Otomatis Flash Sale berhasil disimpan!', 'success');
    }
  }

  function loadJenisProdukData() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            cachedJenisProdukList = res.items;
            populateJenisDropdowns();
            renderJenisProdukTable();
          }
        })
        .getJenisProdukList();
    } else {
      var todayStr = new Date().toISOString().slice(0, 10);
      cachedJenisProdukList = [
        { id: 'JPN-0001', type: 'Brand', name: 'Yusca', description: 'Brand utama sportswear', dateCreated: todayStr },
        { id: 'JPN-0002', type: 'Brand', name: 'Adidas', description: 'Brand sportswear global premium', dateCreated: todayStr },
        { id: 'JPN-0003', type: 'Category', name: 'Sepatu Pria', description: 'Kategori sneakers & sepatu pria', dateCreated: todayStr },
        { id: 'JPN-0004', type: 'Category', name: 'Sepatu Lari', description: 'Kategori sepatu lari & jogging', dateCreated: todayStr },
        { id: 'JPN-0005', type: 'Target / Size', name: 'Pria (Size 39-45)', description: 'Target pria dewasa ukuran standar EU', dateCreated: todayStr }
      ];
      populateJenisDropdowns();
      renderJenisProdukTable();
    }
  }

  function populateJenisDropdowns() {
    var catSelect = document.getElementById('masterCategory');
    var brandSelect = document.getElementById('masterBrand');
    if (!catSelect || !brandSelect) return;

    var categories = cachedJenisProdukList.filter(function(i) { return i.type === 'Category'; });
    var brands = cachedJenisProdukList.filter(function(i) { return i.type === 'Brand'; });

    if (categories.length > 0) {
      catSelect.innerHTML = '';
      categories.forEach(function(c) {
        catSelect.innerHTML += '<option value="' + c.name + '">' + c.name + '</option>';
      });
    }

    if (brands.length > 0) {
      brandSelect.innerHTML = '';
      brands.forEach(function(b) {
        brandSelect.innerHTML += '<option value="' + b.name + '">' + b.name + '</option>';
      });
    }
  }

  function renderJenisProdukTable() {
    var tbody = document.getElementById('jenisProdukTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!cachedJenisProdukList || cachedJenisProdukList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-400">Belum ada Jenis Produk terdaftar.</td></tr>';
      return;
    }

    for (var i = 0; i < cachedJenisProdukList.length; i++) {
      var item = cachedJenisProdukList[i];
      var badgeColor = 'bg-teal-50 text-teal-800 border border-teal-200';
      if (item.type === 'Brand') badgeColor = 'bg-cyan-50 text-cyan-800 border border-cyan-200';
      if (item.type === 'Target / Size') badgeColor = 'bg-amber-50 text-amber-800 border border-amber-200';

      var tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition';
      tr.innerHTML = 
        '<td class="p-3 pl-4 font-mono font-bold text-gray-800">' + item.id + '</td>' +
        '<td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ' + badgeColor + '">' + item.type + '</span></td>' +
        '<td class="p-3 font-semibold text-gray-800">' + item.name + '</td>' +
        '<td class="p-3 text-gray-500 text-xs">' + (item.description || '-') + '</td>' +
        '<td class="p-3 text-gray-400 text-xs">' + item.dateCreated + '</td>' +
        '<td class="p-3 text-right pr-4 space-x-2">' +
          '<button onclick="openJenisProdukModal(true, \'' + item.id + '\', \'' + item.type + '\', \'' + item.name.replace(/'/g, "\\'") + '\', \'' + (item.description || '').replace(/'/g, "\\'") + '\')" class="text-xs text-teal-700 font-semibold hover:underline">Edit</button>' +
          '<button onclick="deleteJenisProdukRecord(\'' + item.id + '\')" class="text-xs text-rose-600 font-semibold hover:underline">Hapus</button>' +
        '</td>';
      tbody.appendChild(tr);
    }
  }

  function openJenisProdukModal(isEdit, id, type, name, desc) {
    document.getElementById('jenisEditId').value = isEdit ? id : '';
    document.getElementById('jenisModalTitle').textContent = isEdit ? 'Edit Jenis Produk (' + id + ')' : 'Tambah Jenis Produk Baru';
    document.getElementById('jenisType').value = type || 'Brand';
    document.getElementById('jenisName').value = name || '';
    document.getElementById('jenisDesc').value = desc || '';
    openModal('jenisProdukModal');
  }

  function submitJenisProduk() {
    var adminName = currentUser ? currentUser.name : 'Admin';
    var payload = {
      id: document.getElementById('jenisEditId').value,
      type: document.getElementById('jenisType').value,
      name: document.getElementById('jenisName').value.trim(),
      description: document.getElementById('jenisDesc').value.trim()
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          closeModal('jenisProdukModal');
          showToast(res.message, res.success ? 'success' : 'error');
          loadJenisProdukData();
        })
        .saveJenisProduk(payload, adminName);
    } else {
      closeModal('jenisProdukModal');
      showToast('Jenis Produk berhasil disimpan (simulasi)!', 'success');
      loadJenisProdukData();
    }
  }

  function deleteJenisProdukRecord(id) {
    document.getElementById('deleteTargetSku').value = id;
    document.getElementById('deleteConfirmSkuText').textContent = id;
    document.getElementById('deleteTypeAction').value = 'jenis';
    openModal('deleteConfirmModal');
  }

  function executeGenericDeletion() {
    var id = document.getElementById('deleteTargetSku').value;
    var action = document.getElementById('deleteTypeAction').value;
    var adminName = currentUser ? currentUser.name : 'Admin';
    closeModal('deleteConfirmModal');

    if (action === 'jenis') {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            showToast(res.message, res.success ? 'success' : 'error');
            loadJenisProdukData();
          })
          .deleteJenisProduk(id, adminName);
      } else {
        showToast('Jenis Produk ' + id + ' dihapus (simulasi)!', 'success');
        loadJenisProdukData();
      }
    } else {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            showToast(res.message, res.success ? 'success' : 'error');
            loadMasterProducts(1);
          })
          .deleteMasterProduct(id, adminName);
      } else {
        showToast('Produk ' + id + ' berhasil dihapus (simulasi)!', 'success');
        loadMasterProducts(1);
      }
    }
  }

    rows.forEach(function(tr) {
      tr.style.display = (tr.textContent.toLowerCase().indexOf(query) !== -1) ? '' : 'none';

  }

  function filterMasterStockTable() {
    var query = document.getElementById('quickSearchMasterInput').value.toLowerCase().trim();
    var rows = document.querySelectorAll('#masterTableBody tr');
    rows.forEach(function(tr) {
      tr.style.display = (tr.textContent.toLowerCase().indexOf(query) !== -1) ? '' : 'none';
    });
  }

  function loadInventory(page) {

          if (res.success) renderInventoryTable(res.items);

      renderInventoryTable([
        { sku: 'SKU-SP-001', productName: 'Adidas Superstar 42', category: 'Sepatu Pria', brand: 'Adidas', quantity: 3, status: 'Low Stock', dateUpdated: '05/09/2026' }
      ]);
    }
  }

      tbody.innerHTML = '<tr><td colspan="8" class="text-center p-4 text-gray-400">Tidak ada data stok.</td></tr>';

        '<td class="p-3 text-right pr-4">' +
          '<button onclick="openStockEditModal(\'' + inv.sku + '\', \'' + inv.productName.replace(/'/g, "\\'") + '\', ' + inv.quantity + ')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-800 px-2.5 py-1 rounded font-medium">Edit Stok</button>' +
        '</td>';
      tbody.appendChild(tr);

    document.getElementById('stockEditSku').value = sku;
    document.getElementById('stockEditLabel').textContent = name;
    document.getElementById('stockEditQty').value = currQty;
    openModal('editStockModal');
  }

  function submitInventoryUpdate() {
    var sku = document.getElementById('stockEditSku').value;
    var qty = document.getElementById('stockEditQty').value;
    var adminName = currentUser ? currentUser.name : 'Admin';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          closeModal('editStockModal');
          showToast(res.message, res.success ? 'success' : 'error');
          loadInventory(1);
        })
        .updateInventoryQuantity(sku, qty, adminName);
    } else {
      closeModal('editStockModal');
      showToast('Stok berhasil diperbarui (simulasi)!', 'success');
      loadInventory(1);
    }
  }

  function loadMasterProducts(page) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            cachedMasterItems = res.items;
            renderMasterTable(res.items);
          }
        })
        .getMasterProductsPaginated(page || 1, 15, '');
    } else {
      var mockMaster = [
        { sku: 'SKU-SP-001', productName: 'Adidas Superstar - Size 42 (Black)', category: 'Sepatu Pria', brand: 'Adidas', price: 1250000, imageUrl: 'https://images.unsplash.com/photo-1582588678413-dbf45f4823e9?w=500', description: 'Sepatu kasual klasik.' },
        { sku: 'SKU-SP-002', productName: 'Adidas Superstar - Size 43 (Black)', category: 'Sepatu Pria', brand: 'Adidas', price: 1250000, imageUrl: 'https://images.unsplash.com/photo-1582588678413-dbf45f4823e9?w=500', description: 'Sepatu kasual.' },
        { sku: 'SKU-NMD-001', productName: 'Adidas NMD R1 Primeknit', category: 'Sepatu Pria', brand: 'Adidas', price: 2100000, imageUrl: 'https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?w=500', description: 'Sneakers running.' }
      ];
      cachedMasterItems = mockMaster;
      renderMasterTable(mockMaster);
    }
  }

  function renderMasterTable(items) {
    var tbody = document.getElementById('masterTableBody');
    tbody.innerHTML = '';
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-400">Belum ada master produk.</td></tr>';
      return;
    }

    for (var i = 0; i < items.length; i++) {
      var m = items[i];
      var tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition';
      tr.innerHTML = '<td class="p-3 pl-4"><img src="' + (m.imageUrl || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500') + '" class="w-10 h-10 object-cover rounded-lg border"></td>' +
        '<td class="p-3 font-mono font-bold text-gray-800">' + m.sku + '</td>' +
        '<td class="p-3 font-medium text-gray-800">' + m.productName + '</td>' +
        '<td class="p-3 text-gray-600">' + m.category + '</td>' +
        '<td class="p-3 font-bold text-teal-800">' + (m.brand || '-') + '</td>' +
        '<td class="p-3 font-bold text-gray-800">Rp ' + (parseFloat(m.price) || 0).toLocaleString('id-ID') + '</td>' +
        '<td class="p-3 text-right pr-4 space-x-2">' +
          '<button onclick="editMasterProductBySku(\'' + m.sku + '\')" class="text-xs text-teal-700 font-bold hover:underline">Edit</button>' +
          '<button onclick="deleteProduct(\'' + m.sku + '\')" class="text-xs text-rose-600 font-bold hover:underline">Hapus</button>' +
        '</td>';
      tbody.appendChild(tr);
    }
  }

  function editMasterProductBySku(sku) {
    var item = null;
    if (cachedMasterItems) {
      for (var i = 0; i < cachedMasterItems.length; i++) {
        if (cachedMasterItems[i].sku === sku) { item = cachedMasterItems[i]; break; }
      }
    }
    if (!item && cachedCatalogItems) {
      for (var j = 0; j < cachedCatalogItems.length; j++) {
        if (cachedCatalogItems[j].sku === sku) { item = cachedCatalogItems[j]; break; }
      }
    }
    if (item) {
      openMasterModal(true, item.sku, item.productName, item.category, item.brand, item.price, item.imageUrl, item.description || '');
    } else {
      showToast('Data produk ' + sku + ' tidak ditemukan!', 'error');
    }
  }

  function openMasterModal(isEdit, sku, name, cat, brand, price, img, desc) {
    document.getElementById('masterIsEdit').value = isEdit ? 'true' : 'false';
    document.getElementById('masterModalTitle').textContent = isEdit ? 'Edit Produk (' + sku + ')' : 'Tambah Produk Baru';
    var skuInput = document.getElementById('masterSku');
    skuInput.value = sku || '';
    skuInput.disabled = !!isEdit;
    document.getElementById('masterName').value = name || '';
    
    if (cat) document.getElementById('masterCategory').value = cat;
    if (brand) document.getElementById('masterBrand').value = brand;

    document.getElementById('masterPrice').value = price || '';
    document.getElementById('masterImage').value = img || '';
    document.getElementById('masterDesc').value = desc || '';
    openModal('masterProductModal');
  }

  function submitMasterProduct() {
    var isEdit = document.getElementById('masterIsEdit').value === 'true';
    var adminName = currentUser ? currentUser.name : 'Admin';
    var payload = {
      sku: document.getElementById('masterSku').value.trim(),
      productName: document.getElementById('masterName').value.trim(),
      category: document.getElementById('masterCategory').value,
      brand: document.getElementById('masterBrand').value,
      price: parseFloat(document.getElementById('masterPrice').value) || 0,
      imageUrl: document.getElementById('masterImage').value.trim(),
      description: document.getElementById('masterDesc').value.trim()
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          closeModal('masterProductModal');
          showToast(res.message, res.success ? 'success' : 'error');
          loadMasterProducts(1);
        })
        .saveMasterProduct(payload, isEdit, adminName);
    } else {
      closeModal('masterProductModal');
      showToast('Data master berhasil disimpan (simulasi)!', 'success');
      loadMasterProducts(1);
    }
  }

  function deleteProduct(sku) {
    document.getElementById('deleteTargetSku').value = sku;
    document.getElementById('deleteConfirmSkuText').textContent = sku;
    document.getElementById('deleteTypeAction').value = 'product';
    openModal('deleteConfirmModal');
  }
</script>
