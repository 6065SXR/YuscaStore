<script>
  var cachedOrdersList = [];

  function loadOrders(page) {
    var adminSection = document.getElementById('adminOrdersSection');
    var customerSection = document.getElementById('customerOrdersSection');

    if (currentUser && currentUser.role === 'Pembeli') {
      if (adminSection) adminSection.classList.add('hidden');
      if (customerSection) customerSection.classList.remove('hidden');

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              cachedOrdersList = res.items;
              renderCustomerOrdersList(res.items);
            }
          })
          .getOrdersPaginated(page || 1, 30, 'All', currentUser.userId);
      } else {
        var mockCustOrders = [
          { orderId: 'ORD-0001', buyerUserId: currentUser.userId, skus: 'SKU-NMD-001', quantities: '1', totalPrice: 2100000, status: 'Confirmed', dateOrdered: '05/09/2026 14:20:10' },
          { orderId: 'ORD-0002', buyerUserId: currentUser.userId, skus: 'SKU-SP-001,SKU-ACC-001', quantities: '1,1', totalPrice: 1435000, status: 'Shipped', dateOrdered: '05/09/2026 15:10:00' }
        ];
        cachedOrdersList = mockCustOrders;
        renderCustomerOrdersList(mockCustOrders);
      }
    } else {
      if (adminSection) adminSection.classList.remove('hidden');
      if (customerSection) customerSection.classList.add('hidden');

      var query = document.getElementById('orderSearchInput').value;
      var status = document.getElementById('orderStatusFilter').value;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              cachedOrdersList = res.items;
              renderOrdersTable(res.items);
            }
          })
          .getOrdersPaginated(page || 1, 15, status, query);
      } else {
        var mockAdminOrders = [
          { orderId: 'ORD-0001', buyerUserId: 'CUST-0001', skus: 'SKU-NMD-001', quantities: '1', totalPrice: 2100000, status: 'Confirmed', dateOrdered: '05/09/2026 14:20:10' },
          { orderId: 'ORD-0002', buyerUserId: 'CUST-0001', skus: 'SKU-SP-001', quantities: '1', totalPrice: 1250000, status: 'Delivered', dateOrdered: '05/09/2026 15:10:00' }
        ];
        cachedOrdersList = mockAdminOrders;
        renderOrdersTable(mockAdminOrders);
      }
    }
  }

  function renderCustomerOrdersList(items) {
    var container = document.getElementById('customerOrdersContainer');
    if (!container) return;
    container.innerHTML = '';

    if (!items || items.length === 0) {
      container.innerHTML = '<div class="bg-white rounded-xl p-8 text-center text-gray-400 text-xs border border-gray-100">Belum ada riwayat pesanan. Yuk belanja sekarang!</div>';
      return;
    }

    for (var i = 0; i < items.length; i++) {
      var ord = items[i];

      var s1Active = (ord.status === 'Pending' || ord.status === 'Confirmed' || ord.status === 'Shipped' || ord.status === 'Delivered');
      var s2Active = (ord.status === 'Shipped' || ord.status === 'Delivered');
      var s3Active = (ord.status === 'Delivered');
      var isCanceled = (ord.status === 'Canceled');

      var progressLineWidth = '0%';
      if (s3Active) progressLineWidth = '100%';
      else if (s2Active) progressLineWidth = '50%';
      else if (s1Active) progressLineWidth = '15%';

      var card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-xs border border-gray-100 p-5 space-y-5';
      card.innerHTML = 
        '<div class="flex justify-between items-start border-b border-gray-100 pb-3 text-xs">' +
          '<div>' +
            '<p class="text-gray-400 font-medium">No. Invoice</p>' +
            '<p class="font-bold text-gray-900 font-mono text-sm">' + ord.orderId + '</p>' +
          '</div>' +
          '<div class="text-right">' +
            '<p class="text-gray-400 font-medium">Tanggal Belanja</p>' +
            '<p class="font-semibold text-gray-700">' + ord.dateOrdered + '</p>' +
          '</div>' +
        '</div>' +

        '<div class="space-y-2">' +
          '<div class="flex justify-between items-center">' +
            '<h4 class="font-bold text-xs text-gray-800 tracking-wide uppercase">Status Pengiriman</h4>' +
            '<span class="text-xs text-teal-700 font-bold">' + ord.status + '</span>' +
          '</div>' +

          (isCanceled ? 
            '<div class="p-3 bg-rose-50 text-rose-700 rounded-xl text-xs font-semibold flex items-center space-x-2 border border-rose-100"><span>🚫</span><span>Pesanan ini telah dibatalkan.</span></div>' : 
            
            '<div class="stepper-pipeline relative">' +
              '<div class="stepper-progress-line" style="width: ' + progressLineWidth + ';"></div>' +

              '<div class="stepper-item ' + (s1Active ? 'completed' : '') + '">' +
                '<div class="stepper-circle">' +
                  '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>' +
                '</div>' +
                '<span class="stepper-label">Sedang Diproses</span>' +
              '</div>' +

              '<div class="stepper-item ' + (s2Active ? 'completed' : '') + '">' +
                '<div class="stepper-circle">' +
                  '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' +
                '</div>' +
                '<span class="stepper-label">Sedang Dikirim</span>' +
              '</div>' +

              '<div class="stepper-item ' + (s3Active ? 'completed' : '') + '">' +
                '<div class="stepper-circle">' +
                  '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' +
                '</div>' +
                '<span class="stepper-label">Telah Diterima</span>' +
              '</div>' +
            '</div>'
          ) +
        '</div>' +

        '<div class="space-y-3 pt-2 border-t border-gray-100">' +
          '<h4 class="font-bold text-xs text-gray-800">Daftar Belanja</h4>' +
          '<div class="bg-gray-50/80 p-3 rounded-xl border border-gray-100 flex items-center justify-between text-xs">' +
            '<div class="flex items-center space-x-3">' +
              '<div class="w-12 h-12 rounded-lg bg-teal-100 text-teal-800 flex items-center justify-center font-bold text-lg">👟</div>' +
              '<div>' +
                '<p class="font-bold text-gray-800">' + ord.skus + '</p>' +
                '<p class="text-gray-400 text-[10px]">SKU: ' + ord.skus + ' | Qty: ' + ord.quantities + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<p class="text-gray-400 text-[10px]">Total</p>' +
              '<p class="font-extrabold text-teal-800">Rp ' + ord.totalPrice.toLocaleString('id-ID') + '</p>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-gray-100 text-xs">' +
          '<div class="bg-slate-50 p-3 rounded-xl border border-gray-100 space-y-1">' +
            '<p class="font-bold text-gray-800 mb-1">Detail Pengiriman</p>' +
            '<p class="text-gray-500">Kurir: <b class="text-gray-700">Ekspedisi Reguler Yusca</b></p>' +
            '<p class="text-gray-500">No. Resi: <b class="text-gray-800 font-mono">RS-' + ord.orderId + '</b></p>' +
          '</div>' +
          '<div class="bg-slate-50 p-3 rounded-xl border border-gray-100 space-y-1">' +
            '<p class="font-bold text-gray-800 mb-1">Pembayaran</p>' +
            '<p class="text-gray-500">Metode: <b class="text-gray-700">Bank Transfer BCA</b></p>' +
            '<p class="text-gray-500">Status: <b class="text-emerald-600 font-bold">Terverifikasi System</b></p>' +
          '</div>' +
        '</div>' +

        '<div class="pt-3 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-3">' +
          '<div class="w-full sm:w-auto text-left">' +
            '<p class="text-gray-400 text-xs">Total Tagihan Pesanan</p>' +
            '<p class="text-base font-extrabold text-teal-800">Rp ' + ord.totalPrice.toLocaleString('id-ID') + '</p>' +
          '</div>' +
          '<div class="flex gap-2 w-full sm:w-auto">' +
            '<button onclick="openChatAdmin()" class="flex-1 sm:flex-none bg-teal-50 hover:bg-teal-100 text-teal-800 border border-teal-200 px-4 py-2 rounded-xl text-xs font-bold transition">' +
              'Chat Admin WA' +
            '</button>' +
          '</div>' +
        '</div>';

      container.appendChild(card);
    }
  }

  function renderOrdersTable(items) {
    var tbody = document.getElementById('ordersTableBody');
    tbody.innerHTML = '';
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-400">Tidak ada data pesanan.</td></tr>';
      return;
    }

    for (var i = 0; i < items.length; i++) {
      var ord = items[i];
      var badgeColor = 'bg-gray-100 text-gray-700';
      if (ord.status === 'Confirmed') badgeColor = 'bg-cyan-50 text-cyan-700 border border-cyan-200';
      if (ord.status === 'Shipped') badgeColor = 'bg-sky-50 text-sky-700 border border-sky-200';
      if (ord.status === 'Delivered') badgeColor = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
      if (ord.status === 'Pending') badgeColor = 'bg-amber-50 text-amber-700 border border-amber-200';
      if (ord.status === 'Canceled') badgeColor = 'bg-rose-50 text-rose-700 border border-rose-200';

      var tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition';
      tr.innerHTML = '<td class="p-3 pl-4 font-bold text-teal-800">' + ord.orderId + '</td>' +
        '<td class="p-3">' + ord.buyerUserId + '</td>' +
        '<td class="p-3 font-mono text-xs">' + ord.skus + '</td>' +
        '<td class="p-3 font-bold text-gray-800">Rp ' + ord.totalPrice.toLocaleString('id-ID') + '</td>' +
        '<td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs font-semibold ' + badgeColor + '">' + ord.status + '</span></td>' +
        '<td class="p-3 text-gray-500 text-xs">' + ord.dateOrdered + '</td>' +
        '<td class="p-3 text-right pr-4">' +
          '<select onchange="updateOrderState(\'' + ord.orderId + '\', this.value)" class="text-xs border rounded p-1 bg-white focus:border-teal-600 focus:outline-none">' +
            '<option value="" disabled selected>Ubah Status</option>' +
            '<option value="Confirmed">Confirmed</option>' +
            '<option value="Shipped">Shipped</option>' +
            '<option value="Delivered">Delivered</option>' +
            '<option value="Canceled">Canceled</option>' +
          '</select>' +
        '</td>';
      tbody.appendChild(tr);
    }
  }

  function updateOrderState(orderId, newStatus) {
    var adminName = currentUser ? currentUser.name : 'Admin';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          showToast(res.message, res.success ? 'success' : 'error');
          loadOrders(1);
          if (res.success && res.waUrl) {
            window.open(res.waUrl, '_blank');
          }
        })
        .updateOrderStatus(orderId, newStatus, adminName);
    } else {
      showToast('Status ' + orderId + ' diubah ke ' + newStatus, 'success');
      loadOrders(1);
    }
  }

  function exportOrdersCSV() {
    if (!cachedOrdersList || cachedOrdersList.length === 0) {
      showToast('Tidak ada data pesanan untuk diexport!', 'warning');
      return;
    }

    var csvRows = [];
    csvRows.push(['Order ID', 'Buyer User ID', 'SKUs', 'Quantities', 'Total Price (IDR)', 'Status', 'Date Ordered', 'Transaction ID']);

    for (var i = 0; i < cachedOrdersList.length; i++) {
      var ord = cachedOrdersList[i];
      csvRows.push([
        '"' + ord.orderId + '"',
        '"' + ord.buyerUserId + '"',
        '"' + ord.skus + '"',
        '"' + ord.quantities + '"',
        ord.totalPrice,
        '"' + ord.status + '"',
        '"' + ord.dateOrdered + '"',
        '"' + (ord.transactionId || '') + '"'
      ]);
    }

    var csvContent = 'data:text/csv;charset=utf-8,' + csvRows.map(function(e) { return e.join(','); }).join('\n');
    var encodedUri = encodeURI(csvContent);
    var link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', 'Laporan_Penjualan_YuscaSTORE_' + new Date().toISOString().slice(0, 10) + '.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    showToast('Data penjualan berhasil diexport ke CSV!', 'success');
  }
</script>
